name: Build and Release Friday AI APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create .env placeholder if not present
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK with Gradle
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Friday-AI-Assistant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Friday-AI-Assistant-APK
          path: release-output/Friday-AI-Assistant.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag or Push to Main)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Friday AI - Son Versiya (APK)
          body: |
            ## 🤖 Friday AI - Şəxsi Səs və Sistem Köməkçisi

            ### 📱 Telefona Necə Quraşdırmaq Olar:
            1. Aşağıdakı **`Friday-AI-Assistant.apk`** faylını birbaşa telefonunuza yükləyin.
            2. Yüklənmiş fayla toxunub **Quraşdır (Install)** seçin.
            3. Tətbiqi açıb səs və sistem icazələrini təsdiqləyin və istifadə edin!

            ---
            *Avtomatik GitHub Actions tərəfindən yaradılmışdır.*
          draft: false
          prerelease: false
          files: release-output/Friday-AI-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
